<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE_TEXT}}</title>
    {{GUIDEME_STYLESHEETS}}
    {{EXTRA_HEAD}}
    <style>
        .logo > img { height: 32px; }
        .notice {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: .25rem 1rem;
            margin-bottom: 1rem;
            padding: .5rem .75rem;
            font-size: 16px;
            background-color: #00000040;
            border-left: calc(1px * var(--gui-scale)) solid #ffb547;
        }
        .notice strong { color: #ffb547; }
        .notice nav { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin-left: auto; }
        .release-footer { margin: 1rem; color: #7f8d99; font-size: 14px; }
        canvas[data-clip] { display: block; max-width: 100%; margin: .5rem auto 1rem; cursor: pointer; background: #20242a; }
        .game-scene-wrapper { max-width: 100%; }
        .game-scene-wrapper .root { min-width: 0; max-width: 100%; }
        .game-scene-wrapper .root > .viewport { width: 100%; }
        .steps-bar { display: flex; align-items: center; gap: .5rem; padding: .15rem; margin-top: .5rem; color: #e4ebf1; background: #11161b; }
        .steps-bar button { min-width: 2.5rem; color: #404040; background: #c6c6c6; border: 0; cursor: pointer; }
        .steps-bar button:hover:enabled { background: #3cd6c6; }
        .steps-bar button:disabled { color: #7f8d99; background: #1d252d; cursor: default; }
        .steps-marks { display: flex; flex: 1; gap: 2px; max-width: 16rem; }
        .steps-marks i { flex: 1; height: 4px; background: #1d252d; }
        .steps-marks i.lit { background: #3cd6c6; }
        .steps-stack { display: grid; margin-bottom: 1rem; }
        .steps-stack > section { grid-area: 1 / 1; min-width: 0; visibility: hidden; }
        .steps-stack > section.shown { visibility: visible; }
        figure[data-shot] { margin: .5rem 0 1rem; }
        figure[data-shot] li.lit { color: #3cd6c6; }
        .shot-picture { position: relative; margin-bottom: .5rem; line-height: 0; }
        .shot-picture img { width: 100%; image-rendering: pixelated; }
        .shot-part { position: absolute; }
        .shot-part.lit { outline: 2px solid #3cd6c6; }
        .shot-part b { position: absolute; left: -2px; top: -2px; padding: 0 3px; font: 12px/14px monospace; color: #ffb547; background: #11161b; }
        .shot-part.lit b { color: #11161b; background: #3cd6c6; }
        .live { max-width: 100%; margin: .5rem 0 1rem; padding: .5rem; font-size: 14px; color: #e4ebf1; background: #11161b; border: 1px solid #373737; box-sizing: border-box; }
        .live button { padding: .1rem .5rem; color: #404040; background: #c6c6c6; border: 0; cursor: pointer; }
        .live input[type=range] { width: 100%; accent-color: #ffb547; }
        .live-dim { color: #7f8d99; }
        .live-input { color: #ffb547; text-align: right; }
        .live-output { color: #3cd6c6; text-align: right; }
        .live-softmax { width: 34rem; }
        .live-row { display: grid; grid-template-columns: 4rem 1fr 3rem 1fr 3rem; gap: .5rem; align-items: center; }
        .live-rule { margin-top: .25rem; padding-top: .25rem; border-top: 1px solid #1d252d; }
        .live-bar { height: .5rem; background: #1d252d; }
        .live-bar i { display: block; height: 100%; background: #3cd6c6; }
        .live-attention { display: flex; flex-wrap: wrap; gap: .75rem; width: fit-content; }
        .live-attention canvas { width: 208px; touch-action: none; cursor: grab; }
        .live-attention table { border-collapse: separate; border-spacing: 1px; margin: 0 0 .5rem; }
        .live-attention th, .live-attention td { min-width: 2.75rem; padding: 0 .2rem; font-weight: normal; text-align: left; color: #7f8d99; background: none; border: 0; }
        .live-attention tr { cursor: pointer; }
        .live-attention tr.chosen th { color: #ffb547; }
        .live-attention tr.chosen td { outline: 1px solid #ffb547; }
        .live-curve { width: 38rem; }
        .live-curve canvas { display: block; width: 100%; }
        .live-legend { display: flex; flex-wrap: wrap; gap: 1rem; margin: .25rem 0; }
        .live-controls { display: flex; gap: .25rem; }
    </style>
</head>
<body data-path-to-root="{{RELATIVE_PATH_TO_ROOT}}">

<main>
<div class="topLogoBar">
    <a href="{{HOME_URL}}" class="logo">
        <img src="{{LOGO_URL}}" alt="" />
        {{GUIDE_TITLE}}
    </a>
    <!-- burger menu used on mobile devices when the actual navigation bar is hidden -->
    <a
            role="button"
            class="navbar-burger"
            aria-label="menu"
    >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    </a>
</div>
<div class="page-title"><h1>{{PAGE_TITLE}}</h1></div>
<aside>
    <span class="search-slot"></span>
    {{GUIDE_NAVBAR}}
</aside>
<article>
    <div class="notice">
        <span><strong>Experimental alpha.</strong> Expect breaking changes and major bugs. Your
            <a href="https://github.com/metrovoc/Residual/issues">feedback</a> is much appreciated.</span>
        <nav>
            <a href="https://github.com/metrovoc/Residual/releases">Download</a>
            <a href="https://github.com/metrovoc/Residual">GitHub</a>
            <a href="https://discord.gg/UuV4hEYVFy">Discord</a>
            <a data-locale-link href="{{RELATIVE_PATH_TO_ROOT}}zh-cn/index.html" lang="zh-Hans" hreflang="zh-Hans">简体中文</a>
        </nav>
    </div>
    <div id="page-content">
        {{PAGE_CONTENT}}
    </div>
</article>
<footer class="release-footer" data-release></footer>
</main>
{{GUIDEME_SCRIPTS}}
<script>
(function () {
const root = new URL(document.body.dataset.pathToRoot || "./", location.href);
const players = new Map();
// plays the field notes' clips: a first frame, then the 16x16 tiles each later frame changes
async function playClip(canvas, state) {
    const file = "clips/" + canvas.dataset.clip + ".clip";
    const response = await fetch(new URL(file, root), {signal: state.request.signal});
    if (!response.ok) throw new Error(`Clip ${file}: HTTP ${response.status}`);
    const data = await response.arrayBuffer();
    const view = new DataView(data);
    let at = 4;
    const u16 = () => (at += 2, view.getUint16(at - 2));
    const image = async () => {
        const size = view.getUint32(at);
        const part = new Uint8Array(data, at + 4, size);
        at += 4 + size;
        if (!size) return null;
        const bitmap = await createImageBitmap(new Blob([part]));
        if (state.request.signal.aborted) {
            bitmap.close();
            throw new DOMException("Clip removed", "AbortError");
        }
        state.images.push(bitmap);
        return bitmap;
    };
    const [width, height, display, ms, hold, frames, columns, tile] = Array.from({length: 8}, u16);
    const first = await image(), atlas = await image();
    const counts = Array.from({length: frames - 1}, u16);
    const placed = counts.map(n => Array.from({length: n}, () => [u16(), u16(), u16()]));
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `calc(${display}px * var(--gui-scale, 2))`;
    const context = canvas.getContext("2d");
    context.drawImage(first, 0, 0);
    let frame = 0, clock = 0, last = 0, paused = false, seen = true;
    canvas.addEventListener("click", () => paused = !paused);
    state.observer = new IntersectionObserver(([entry]) => seen = entry.isIntersecting);
    state.observer.observe(canvas);
    const step = now => {
        clock += seen && !paused ? Math.min(100, now - last) : 0;
        last = now;
        if (clock >= (frames - 1) * ms + hold) {
            clock = frame = 0;
            context.drawImage(first, 0, 0);
        }
        for (const target = Math.min(frames - 1, Math.floor(clock / ms)); frame < target; frame++) {
            for (const [x, y, i] of placed[frame]) {
                context.drawImage(atlas, i % columns * tile, Math.floor(i / columns) * tile, tile, tile, x * tile, y * tile, tile, tile);
            }
        }
        state.frame = requestAnimationFrame(step);
    };
    state.frame = requestAnimationFrame(step);
}
const clips = new IntersectionObserver(entries => {
    for (const entry of entries) {
        const state = players.get(entry.target);
        if (entry.isIntersecting && state && !state.started) {
            state.started = true;
            clips.unobserve(entry.target);
            playClip(entry.target, state).catch(error => {
                state.images.forEach(bitmap => bitmap.close());
                state.images = [];
                if (!state.request.signal.aborted) console.error("Failed to play clip", entry.target.dataset.clip, error);
            });
        }
    }
}, {rootMargin: "200px"});
let mounted;
function mount() {
    const page = document.getElementById("page-content");
    if (page === mounted) return;
    for (const [canvas, state] of players) {
        clips.unobserve(canvas);
        state.request.abort();
        if (state.observer) state.observer.disconnect();
        cancelAnimationFrame(state.frame);
        state.images.forEach(bitmap => bitmap.close());
        state.images = [];
    }
    players.clear();
    mounted = page;
    if (!page) return;
    page.querySelectorAll("canvas[data-clip]").forEach(canvas => {
        players.set(canvas, {request: new AbortController(), images: [], frame: 0});
        clips.observe(canvas);
    });
}
const page = document.getElementById("page-content");
if (page) {
    new MutationObserver(mount).observe(page.parentNode, {childList: true});
    mount();
}
})();
</script>
</body>
</html>
