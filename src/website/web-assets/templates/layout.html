<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_TITLE_TEXT}}</title>
    {{GUIDEME_STYLESHEETS}}
    {{EXTRA_HEAD}}
    <style>
        .logo > img { height: 32px; }
        .notice {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: .25rem 1rem;
            margin-bottom: 1rem;
            padding: .5rem .75rem;
            font-size: 16px;
            background-color: #00000040;
            border-left: calc(1px * var(--gui-scale)) solid #ffb547;
        }
        .notice strong { color: #ffb547; }
        .notice nav { display: flex; gap: 1rem; margin-left: auto; }
        canvas[data-clip] { display: block; max-width: 100%; margin: .5rem auto 1rem; cursor: pointer; background: #20242a; }
    </style>
</head>
<body data-path-to-root="{{RELATIVE_PATH_TO_ROOT}}">

<main>
<div class="topLogoBar">
    <a href="{{HOME_URL}}" class="logo">
        <img src="{{LOGO_URL}}" alt="" />
        {{GUIDE_TITLE}}
    </a>
    <!-- burger menu used on mobile devices when the actual navigation bar is hidden -->
    <a
            role="button"
            class="navbar-burger"
            aria-label="menu"
    >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    </a>
</div>
<div class="page-title"><h1>{{PAGE_TITLE}}</h1></div>
<aside>
    <span class="search-slot"></span>
    {{GUIDE_NAVBAR}}
</aside>
<article>
    <div class="notice">
        <span><strong>Experimental alpha.</strong> Expect breaking changes and major bugs. Your
            <a href="https://github.com/metrovoc/Residual/issues">feedback</a> is much appreciated.</span>
        <nav>
            <a href="https://github.com/metrovoc/Residual/releases">Download</a>
            <a href="https://github.com/metrovoc/Residual">GitHub</a>
            <a href="https://discord.gg/UuV4hEYVFy">Discord</a>
        </nav>
    </div>
    <div id="page-content">
        {{PAGE_CONTENT}}
    </div>
</article>
{{FOOTER}}
</main>
{{GUIDEME_SCRIPTS}}
<script>
// plays the field notes' clips: a first frame, then the 16x16 tiles each later frame changes
async function playClip(canvas) {
    const file = "clips/" + canvas.dataset.clip + ".clip";
    const data = await (await fetch(document.body.dataset.pathToRoot + file)).arrayBuffer();
    const view = new DataView(data);
    let at = 4;
    const u16 = () => (at += 2, view.getUint16(at - 2));
    const image = async () => {
        const size = view.getUint32(at);
        const part = new Uint8Array(data, at + 4, size);
        at += 4 + size;
        return size ? createImageBitmap(new Blob([part])) : null;
    };
    const [width, height, display, ms, hold, frames, columns, tile] = Array.from({length: 8}, u16);
    const first = await image(), atlas = await image();
    const counts = Array.from({length: frames - 1}, u16);
    const placed = counts.map(n => Array.from({length: n}, () => [u16(), u16(), u16()]));
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `calc(${display}px * var(--gui-scale, 2))`;
    const context = canvas.getContext("2d");
    context.drawImage(first, 0, 0);
    let frame = 0, clock = 0, last = 0, paused = false, seen = true;
    canvas.addEventListener("click", () => paused = !paused);
    new IntersectionObserver(([entry]) => seen = entry.isIntersecting).observe(canvas);
    const step = now => {
        clock += seen && !paused ? Math.min(100, now - last) : 0;
        last = now;
        if (clock >= (frames - 1) * ms + hold) {
            clock = frame = 0;
            context.drawImage(first, 0, 0);
        }
        for (const target = Math.min(frames - 1, Math.floor(clock / ms)); frame < target; frame++) {
            for (const [x, y, i] of placed[frame]) {
                context.drawImage(atlas, i % columns * tile, Math.floor(i / columns) * tile, tile, tile, x * tile, y * tile, tile, tile);
            }
        }
        requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}
const clips = new IntersectionObserver(entries => {
    for (const entry of entries) {
        if (entry.isIntersecting) {
            clips.unobserve(entry.target);
            playClip(entry.target);
        }
    }
}, {rootMargin: "200px"});
document.querySelectorAll("canvas[data-clip]").forEach(canvas => clips.observe(canvas));
</script>
</body>
</html>
