modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/metrovoc/Residual/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "metrovoc"
displayURL = "https://github.com/metrovoc/Residual"
logoFile = "residual_logo.png"
description = '''
Rediscover the lost art of building intelligence from scratch.

Someone lived in this world before you and built machines that thought. Find what is left of them, design those machines again from the smallest operations there are, cable them into a real language model, train it on real text with real gradients, and put it to work in the body of an agent.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "guideme"
type = "required"
versionRange = "[${guideme_version},)"
ordering = "NONE"
side = "BOTH"
