modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/metrovoc/Residual/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "metrovoc"
displayURL = "https://github.com/metrovoc/Residual"
logoFile = "residual_logo.png"
description = '''
Build minds from the ground up, one block at a time.

Someone lived in this world before you and built machines that thought. Recover their writing
from the ruins, wire embedding tables, attention heads and feed-forward blocks into a language
model, train it on real text with real gradients, and put it to work in the body of an apprentice.
Every mind you build exports as working PyTorch code.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "guideme"
type = "required"
versionRange = "[${guideme_version},)"
ordering = "NONE"
side = "BOTH"
