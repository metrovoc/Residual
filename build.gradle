plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
}

// Development-only driver that plays scripted sessions in the client (see the rehearsal run); never packaged.
sourceSets {
    rehearsal
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.rehearsal

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Live-reload guide pages from the source tree while developing.
            systemProperty 'guideme.residual.guide.sources', file('src/main/resources/assets/residual/guides/residual/guide').absolutePath
            programArguments.addAll '--width', '1600', '--height', '1000'
        }
        // ./gradlew runRehearsal -Pscript=<file> [-Pmonitor=<display name>]
        rehearsal {
            client()
            sourceSet = sourceSets.rehearsal
            gameDirectory = file('run/rehearsal')
            var projectDir = layout.projectDirectory
            systemProperties.put 'residual.rehearsal', providers.gradleProperty('script').map { projectDir.file(it).asFile.absolutePath }.orElse('')
            systemProperties.put 'residual.rehearsal.monitor', providers.gradleProperty('monitor').orElse('')
            // where the guide export unpacks FFmpeg, rather than ~/.javacpp
            systemProperty 'org.bytedeco.javacpp.cachedir', file('run/rehearsal/javacpp').absolutePath
            programArguments.addAll '--width', '1600', '--height', '1000'
        }
        // ./gradlew runGuideExport [-Pmonitor=<display name>]: exports the field notes into build/guideExport and quits
        guideExport {
            client()
            sourceSet = sourceSets.rehearsal
            gameDirectory = file('run/rehearsal')
            systemProperty 'guideme.exportOnStartupAndExit', 'residual:guide'
            systemProperty 'guideme.exportDestination.residual.guide', file('build/guideExport').absolutePath
            systemProperties.put 'residual.rehearsal.monitor', providers.gradleProperty('monitor').orElse('')
            systemProperty 'org.bytedeco.javacpp.cachedir', file('run/rehearsal/javacpp').absolutePath
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.rehearsal)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    implementation "org.appliedenergistics:guideme:${guideme_version}"
    rehearsalImplementation sourceSets.main.output
    rehearsalRuntimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    // GuideME's guide export encodes animated icons with FFmpeg, here the build for this machine
    var os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    var javacppPlatform = (os.contains('mac') ? 'macosx' : os.contains('windows') ? 'windows' : 'linux') + '-' +
            (System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'x86_64')
    rehearsalRuntimeOnly "org.bytedeco:ffmpeg:${ffmpeg_version}"
    rehearsalRuntimeOnly "org.bytedeco:ffmpeg:${ffmpeg_version}:${javacppPlatform}"
    rehearsalRuntimeOnly "org.bytedeco:javacpp:${ffmpeg_version.split('-')[1]}:${javacppPlatform}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
    // the tests run in the game's folder; TranslationsTest reads the sources
    systemProperty 'residual.resources', file('src/main/resources').absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            guideme_version        : guideme_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
    }
}

// ./gradlew guideWebsite [-Pmonitor=<display name>]: the field notes as a website in build/guideWebsite, made from
// their export by a newer GuideME, since 26.1's drops scene annotations
configurations {
    guideWebsite
}
dependencies {
    guideWebsite("org.appliedenergistics:guideme:${guideme_website_version}") { transitive = false }
}
tasks.register('guideWebsite', JavaExec) {
    dependsOn 'runGuideExport'
    classpath = configurations.guideWebsite + sourceSets.rehearsal.runtimeClasspath.filter { !it.name.startsWith('guideme-') }
    mainClass = 'guideme.web.WebSiteGenerator'
    // its logs go here rather than into the project
    workingDir = temporaryDir
    // src/website holds the page template, which adds the alpha notice to every page, and the logo
    args '--data', file('build/guideExport').absolutePath,
            '--output', layout.buildDirectory.dir('guideWebsite').get().asFile.absolutePath, '--clean', '--title', mod_name,
            '--web-assets', file('src/website/web-assets').absolutePath, '--logo', file('src/website/logo.png').absolutePath,
            '--site-url', 'https://metrovoc.github.io', '--base-path', '/Residual/'
}
