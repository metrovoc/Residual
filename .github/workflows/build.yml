name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: residual
          path: build/libs/*.jar

      # the exported PyTorch code must compute exactly what the game computes
      - uses: astral-sh/setup-uv@v6
      - run: RESIDUAL_PARITY_DIR=$PWD/build/parity ./gradlew test --rerun --tests '*PyTorchParityTest*'
      - run: >-
          uv run --no-project --with torch --with numpy
          --extra-index-url https://download.pytorch.org/whl/cpu
          python src/test/python/parity.py build/parity

      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python tools/pack.py
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/pack/*.mrpack
